name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app && ./gradlew assembleDebug
          else
            echo "Searching for build files..."
            gradle_file=$(find . -name "gradlew" | head -n 1)
            if [ -n "$gradle_file" ]; then
              dir_name=$(dirname "$gradle_file")
              chmod +x "$gradle_file"
              cd "$dir_name" && ./gradlew assembleDebug
            else
              echo "Error: gradlew not found. Building with generic gradle if available..."
              gradle assembleDebug
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'

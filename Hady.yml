name: Simple Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile and Build APK
        run: |
          # لو فيه ملف gradlew يشتغله، لو مش موجود يبني بأمر gradle مباشر
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app && ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'

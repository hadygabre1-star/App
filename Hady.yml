name: Direct Gradle Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK Directly
        run: |
          # لو فيه ملف بناء في مجلد فرعي يدخل عليه، لو مفيش يبني مباشرة
          if [ -d "app" ]; then
            cd app
          fi
          
          # فحص وإعطاء صلاحيات لو موجود، أو البناء بالأمر المباشر
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'

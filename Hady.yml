name: Ultimate Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Wrapper and Build APK
        run: |
          # التحقق من وجود ملف gradlew أو إنشائه تلقائياً لو غير موجود
          if [ ! -f "./gradlew" ] && [ ! -f "app/gradlew" ]; then
            echo "Gradlew not found, generating gradle wrapper..."
            gradle wrapper
          fi

          # البحث عن مكان gradlew وبناء التطبيق
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app && ./gradlew assembleDebug
          else
            gradle_path=$(find . -name "gradlew" | head -n 1)
            if [ -n "$gradle_path" ]; then
              dir_name=$(dirname "$gradle_path")
              chmod +x "$gradle_path"
              cd "$dir_name" && ./gradlew assembleDebug
            else
              echo "Using system gradle fallback..."
              gradle assembleDebug
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'

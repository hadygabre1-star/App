name: Build H.A.L APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          # البحث عن المجلد أو الملف الصحيح داخل المستودع
          if [ -d "HAL_Android_Project" ]; then
            echo "Entering HAL_Android_Project directory..."
            cd HAL_Android_Project
          elif [ -d "app" ]; then
            echo "Using root app directory..."
          else
            # البحث عن مجلد يحتوي على gradlew تلقائياً
            TARGET_DIR=$(dirname "$(find . -name "gradlew" | head -n 1)")
            if [ "$TARGET_DIR" != "." ] && [ -n "$TARGET_DIR" ]; then
              echo "Moving to $TARGET_DIR"
              cd "$TARGET_DIR"
            fi
          fi

          # إعطاء صلاحيات البناء والتنفيذ
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'

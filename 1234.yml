name: Build HAL APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate and Build Project
        run: |
          # البحث التلقائي عن المجلد الذي يحتوي على ملف البناء gradle
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "No build.gradle found in standard paths, checking subfolders..."
          fi

          # التحقق من وجود gradlew أو إنشائه للبناء
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Generating gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'

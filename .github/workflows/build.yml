name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "app/gradlew" ]; then
            cd app && ./gradlew assembleDebug
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            DIR_PATH=$(dirname "$GRADLE_PATH")
            cd "$DIR_PATH" && ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app-debug.apk'
